<!doctype html>
<html lang="en">
<head>
<!-- Contact-page metadata and shared typography/style resources. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Get in touch with the Olympicon team about Liverpool's tabletop gaming convention.">

<title>Contact Us | Olympicon</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>

<body>
<div class="greek-border" aria-hidden="true"></div>

<!-- Keep page navigation consistent with the main event site. -->
<header class="site-header">
<a class="brand" href="site.html#home">
  <img class="brand-logo" src="./images/Olympicon_Logo.png" alt="Olympicon logo">
  <span>OLYMPICON</span>
</a>

<button class="menu-toggle" aria-expanded="false" aria-controls="main-nav" aria-label="Toggle navigation">
☰
</button>

<nav id="main-nav" class="main-nav">
<a href="site.html#activities">Activities</a>
<a href="site.html#visit">Visit</a>
<a href="site.html#faq">FAQ</a>
<a href="contact.html" aria-current="page">Contact</a>
<a href="https://www.facebook.com/LiverpoolOlympicon" target="_blank" rel="noopener noreferrer">Facebook</a>
<a href="https://www.instagram.com/liverpool.olympicon" target="_blank" rel="noopener noreferrer">Instagram</a>
<a class="nav-ticket" href="site.html#tickets">Tickets</a>
</nav>
</header>

<main>
<section class="contact-section">
<div class="contact-card">
<p class="eyebrow dark">GET IN TOUCH</p>
<h1>Contact Us</h1>
<p>Have a question about Olympicon? We’d love to hear from you.</p>

<form class="contact-form" action="https://formsubmit.co/hello@olympicon.org" method="POST">
<div class="contact-field">
<label for="contact-name">Name</label>
<input id="contact-name" type="text" name="name" autocomplete="name" required>
</div>

<div class="contact-field">
<label for="contact-email">Email</label>
<input id="contact-email" type="email" name="email" autocomplete="email" required>
</div>

<div class="contact-field">
<label for="contact-message">Message</label>
<textarea id="contact-message" name="message" rows="6" required></textarea>
</div>

<button class="button button-gold" type="submit">Send</button>
</form>

<a class="button button-outline contact-back-link" href="site.html">Back to Olympicon</a>
</div>
</section>
</main>

<div class="greek-border" aria-hidden="true"></div>
<footer class="site-footer">
<h3>OLYMPICON</h3>
<p>Meeples • Mingling • Merseyside</p>
<a class="button button-gold footer-social-link" href="contact.html" aria-current="page">Contact Us</a>
<a class="button button-gold footer-social-link" href="https://www.facebook.com/LiverpoolOlympicon" target="_blank" rel="noopener noreferrer">
Follow us on Facebook
</a>
<a class="button button-gold footer-social-link" href="https://www.instagram.com/liverpool.olympicon" target="_blank" rel="noopener noreferrer">
Follow us on Instagram
</a>
</footer>

<script src="script.js"></script>
</body>
</html>
